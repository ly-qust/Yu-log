services:
  mysql:
    image: mysql:8.0
    container_name: yu-log-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yu_log}
      MYSQL_USER: ${MYSQL_USER:-yu_log}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yu_log_dev_pwd}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: yu-log-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  mysql_dev_data:
  redis_dev_data:
