spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:yu_log}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  sql:
    init:
      mode: never

logging:
  level:
    root: info
    com.yu.blog: info

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-seconds: ${JWT_ACCESS_EXPIRE:7200}
  refresh-token-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}

yu-log:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}
  cache:
    enabled: ${YU_LOG_CACHE_ENABLED:true}
    home-ttl-seconds: ${YU_LOG_CACHE_HOME_TTL:300}
    category-ttl-seconds: ${YU_LOG_CACHE_CATEGORY_TTL:1800}
    tag-ttl-seconds: ${YU_LOG_CACHE_TAG_TTL:1800}
    article-ttl-seconds: ${YU_LOG_CACHE_ARTICLE_TTL:300}
    project-ttl-seconds: ${YU_LOG_CACHE_PROJECT_TTL:600}
    note-ttl-seconds: ${YU_LOG_CACHE_NOTE_TTL:600}
    timeline-ttl-seconds: ${YU_LOG_CACHE_TIMELINE_TTL:600}
    about-ttl-seconds: ${YU_LOG_CACHE_ABOUT_TTL:1800}
  article-counter:
    initial-delay-ms: ${YU_LOG_ARTICLE_COUNTER_INITIAL_DELAY_MS:60000}
    sync-delay-ms: ${YU_LOG_ARTICLE_COUNTER_SYNC_DELAY_MS:60000}
  storage:
    type: ${YU_LOG_STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH}
    public-prefix: ${STORAGE_PUBLIC_PREFIX:/uploads}
    max-size-mb: ${STORAGE_MAX_SIZE_MB:5}
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
