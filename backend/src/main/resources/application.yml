spring:
  application:
    name: yu-log-backend
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: ${YU_LOG_FLYWAY_ENABLED:true}
    locations: ${YU_LOG_FLYWAY_LOCATIONS:classpath:db}
    baseline-on-migrate: ${YU_LOG_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${YU_LOG_FLYWAY_BASELINE_VERSION:6}
    validate-on-migrate: true

server:
  error:
    include-message: never
    include-stacktrace: never

  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true
    redis:
      enabled: true
  endpoint:
    health:
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
